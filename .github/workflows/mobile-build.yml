name: Mobile Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/Dyract.App/**'
      - 'src/Dyract.Client/**'
      - 'src/Dyract.Core/**'
      - 'src/Dyract.Crypto/**'
      - 'src/Dyract.Protocol/**'
      - 'src/Dyract.Storage/**'
      - 'src/Dyract.Transport/**'
      - 'Dyract.Mobile.slnx'
      - '.github/workflows/mobile-build.yml'

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET environment
        run: dotnet --info

      - name: Show validation snapshot
        run: echo "Validating reliable messaging final snapshot at millisecond wire precision"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Android app
        run: dotnet build src/Dyract.App/Dyract.App.csproj -f net10.0-android --configuration Release
