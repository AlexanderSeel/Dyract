name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Dyract.slnx

      - name: Build
        run: dotnet build Dyract.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Dyract.slnx --configuration Release --no-build

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dyract_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dyract_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DYRACT_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=dyract_tests;Username=postgres;Password=postgres;Pooling=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run PostgreSQL migration tests
        run: >
          dotnet test tests/Dyract.Tests/Dyract.Tests.csproj
          --configuration Release
          --filter FullyQualifiedName~PostgresSchemaMigrationTests
