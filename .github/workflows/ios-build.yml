name: iOS Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/Dyract.App/**'
      - 'src/Dyract.Client/**'
      - 'src/Dyract.Core/**'
      - 'src/Dyract.Crypto/**'
      - 'src/Dyract.Protocol/**'
      - 'src/Dyract.Storage/**'
      - 'src/Dyract.Transport/**'
      - 'Dyract.Mobile.slnx'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

permissions:
  contents: read

jobs:
  ios-simulator-build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show toolchain
        run: |
          dotnet --info
          xcodebuild -version
          xcode-select -p

      - name: Install MAUI mobile workloads
        run: dotnet workload install maui-ios maui-android

      - name: Build iOS simulator app
        run: >
          dotnet build src/Dyract.App/Dyract.App.csproj
          -f net10.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64
          --configuration Release

# Validation marker: corrected platform-native identity signers.
