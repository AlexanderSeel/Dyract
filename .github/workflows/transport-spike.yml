name: Transport Spike

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'experiments/Dyract.Transport.FsWebRtcProbe/**'
      - 'src/Dyract.Transport/**'
      - 'src/Dyract.Protocol/**'
      - 'src/Dyract.Core/**'
      - 'Dyract.TransportSpike.slnx'
      - '.github/workflows/transport-spike.yml'

concurrency:
  group: transport-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

permissions:
  contents: read

jobs:
  android-binding-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET environment
        run: dotnet --info

      - name: Show SDK version
        run: dotnet --version

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Show installed workloads
        run: dotnet workload list

      - name: Restore FsWebRTC binding probe
        run: dotnet restore experiments/Dyract.Transport.FsWebRtcProbe/Dyract.Transport.FsWebRtcProbe.csproj

      - name: Build FsWebRTC binding probe
        shell: bash
        run: |
          set -o pipefail
          dotnet build experiments/Dyract.Transport.FsWebRtcProbe/Dyract.Transport.FsWebRtcProbe.csproj --configuration Release --no-restore 2>&1 | tee transport-build.log

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transport-build-log
          path: transport-build.log
          if-no-files-found: warn
